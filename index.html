<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>나다의 랜덤뽑기</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Jua&display=swap">
<style>
:root{--bg:#efeaff;--dot:#d6ccff;--card:#fff;--ink:#1c1650;--mute:#6b63a8;--line:#1c1650;--pink:#ff3d81;--yel:#ffd23f;--mint:#2ee6a6;--blue:#4d7cff;--org:#ff8a3d;--vio:#a66bff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14123a;--dot:#231e5c;--card:#201c58;--ink:#f4f1ff;--mute:#a9a2e6;--line:#05041a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14123a;--dot:#231e5c;--card:#201c58;--ink:#f4f1ff;--mute:#a9a2e6;--line:#05041a;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background-color:var(--bg);background-image:radial-gradient(var(--dot) 1.6px,transparent 1.7px);background-size:22px 22px;color:var(--ink);font-family:'Jua','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif;font-size:17px;overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:560px;margin:0 auto;padding:18px 16px 48px}
header{text-align:center;padding:26px 0 18px;position:relative}
h1{margin:0;display:inline-block;font-family:'Black Han Sans','Jua','Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-weight:400;font-size:clamp(44px,13vw,76px);line-height:1.05;color:var(--yel);-webkit-text-stroke:3px #14123a;paint-order:stroke fill;text-shadow:3px 3px 0 #14123a,6px 6px 0 var(--pink),10px 10px 0 var(--blue);transform:rotate(-3deg);letter-spacing:1px;animation:drop .8s cubic-bezier(.2,1.4,.4,1) both}
@keyframes drop{from{transform:translateY(-60px) rotate(-12deg) scale(.7);opacity:0}to{transform:rotate(-3deg)}}
.tw{position:absolute;font-size:26px;color:var(--yel);animation:tw 1.8s ease-in-out infinite;text-shadow:0 0 8px var(--yel)}
.tw:nth-of-type(1){left:6%;top:18px}.tw:nth-of-type(2){right:5%;top:8px;animation-delay:.6s;color:var(--mint);text-shadow:0 0 8px var(--mint)}.tw:nth-of-type(3){right:12%;bottom:6px;animation-delay:1.1s;color:var(--pink);text-shadow:0 0 8px var(--pink)}
@keyframes tw{0%,100%{transform:scale(.5) rotate(0);opacity:.4}50%{transform:scale(1.15) rotate(25deg);opacity:1}}
.sub{margin:22px 0 0;color:var(--mute)}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0 18px}
.tab{border:3px solid var(--line);background:var(--card);border-radius:16px;padding:10px 4px;box-shadow:0 4px 0 var(--line);line-height:1.25;transition:transform .12s,box-shadow .12s}
.tab span{display:block;font-size:26px}
.tab[aria-selected="true"]{background:var(--yel);color:#1c1650;transform:translateY(4px);box-shadow:0 0 0 var(--line)}
.card{background:var(--card);border:3px solid var(--line);border-radius:22px;box-shadow:0 6px 0 var(--line);padding:16px}
.panel[hidden]{display:none}
.stage{display:flex;flex-direction:column;align-items:center;gap:16px;margin-bottom:18px;padding-top:22px}
.big{border:3px solid var(--line);border-radius:999px;background:var(--pink);color:#fff;padding:12px 34px;font-size:22px;box-shadow:0 5px 0 var(--line);transition:transform .1s,box-shadow .1s}
.big:active{transform:translateY(5px);box-shadow:0 0 0 var(--line)}
.big:disabled{opacity:.55;cursor:not-allowed}
.sm{border:2px solid var(--line);border-radius:12px;background:var(--mint);color:#1c1650;padding:6px 14px;font-size:15px}
/* wheel */
.wheelbox{position:relative;width:min(86vw,400px);aspect-ratio:1}
#wheel{width:100%;height:100%;display:block;cursor:pointer}
.ptr{position:absolute;left:50%;top:-6px;width:0;height:0;margin-left:-17px;border-left:17px solid transparent;border-right:17px solid transparent;border-top:36px solid var(--pink);filter:drop-shadow(0 3px 0 var(--line));z-index:2}
/* sticks */
.cup{width:100%;display:flex;flex-wrap:wrap;justify-content:center;gap:26px 7px;padding:30px 14px 16px;background:repeating-linear-gradient(90deg,#c0392b 0 14px,#d8483a 14px 28px);border:3px solid var(--line);border-radius:14px 14px 40px 40px}
.stick{position:relative;width:38px;height:128px;border:2px solid #14123a;border-radius:6px 6px 3px 3px;background:linear-gradient(90deg,#f1c47f,#dfa24f);padding:0;transition:transform .35s cubic-bezier(.2,1.3,.4,1);transform:rotate(var(--r,0deg));overflow:hidden}
.stick i{display:block;height:34px;background:var(--pink);border-bottom:2px solid #14123a}
.stick b{display:block;font-weight:400;font-size:15px;writing-mode:vertical-rl;margin:8px auto 0;color:#14123a;opacity:0;transition:opacity .3s .25s;max-height:80px;overflow:hidden}
.stick:hover{transform:rotate(var(--r,0deg)) translateY(-8px)}
.stick.out{transform:translateY(-30px);cursor:default}
.stick.out b{opacity:1}
.tip{margin:0;color:var(--mute);font-size:15px;text-align:center}
/* gacha */
.machine{width:250px;display:flex;flex-direction:column;align-items:center}
.dome{position:relative;width:228px;height:228px;border-radius:50%;border:4px solid var(--line);background:radial-gradient(circle at 30% 25%,rgba(255,255,255,.85),rgba(190,225,255,.45) 45%,rgba(120,170,255,.35));overflow:hidden;margin-bottom:-26px;z-index:1}
.ball{position:absolute;width:54px;height:54px;border-radius:50%;border:2px solid #14123a;background:linear-gradient(180deg,var(--c) 50%,#fff 50%)}
.ball::after{content:"";position:absolute;left:10px;top:8px;width:12px;height:7px;border-radius:50%;background:rgba(255,255,255,.7);transform:rotate(-30deg)}
.dome.shake .ball{animation:jig .22s linear infinite}
.dome.shake .ball:nth-child(odd){animation-direction:reverse}
@keyframes jig{0%{transform:translate(0,0) rotate(0)}25%{transform:translate(7px,-9px) rotate(40deg)}50%{transform:translate(-6px,5px) rotate(-30deg)}75%{transform:translate(5px,8px) rotate(25deg)}100%{transform:translate(0,0) rotate(0)}}
.mbody{position:relative;width:250px;height:210px;background:var(--pink);border:4px solid var(--line);border-radius:26px 26px 18px 18px;padding-top:42px;display:flex;flex-direction:column;align-items:center;gap:14px;box-shadow:0 6px 0 var(--line)}
.knobrow{display:flex;align-items:center;gap:14px;background:#14123a;color:var(--yel);padding:6px 16px 6px 8px;border-radius:40px}
.knob{width:52px;height:52px;border-radius:50%;background:var(--yel);border:3px solid #fff;position:relative;transition:transform 1s cubic-bezier(.3,1.2,.5,1)}
.knob::after{content:"";position:absolute;left:50%;top:6px;width:8px;height:40px;margin-left:-4px;background:#14123a;border-radius:4px}
.outlet{position:relative;width:110px;height:78px;background:#14123a;border-radius:14px 14px 8px 8px;overflow:hidden;display:flex;align-items:flex-end;justify-content:center;border:3px solid #fff3}
.cap{position:relative;width:60px;height:60px;margin-bottom:4px;background:none;border:0;padding:0;animation:fall .75s cubic-bezier(.3,.1,.6,1.4) both}
.cap .t,.cap .b{position:absolute;left:0;width:60px;height:30px;border:2px solid #fff;transition:transform .5s}
.cap .t{top:0;border-radius:30px 30px 0 0;background:var(--c)}
.cap .b{bottom:0;border-radius:0 0 30px 30px;background:#f4f1ff}
.cap.open .t{transform:translate(-16px,-22px) rotate(-28deg)}
.cap.open .b{transform:translate(12px,12px) rotate(18deg)}
.cap.ready{animation:hop .8s ease-in-out infinite}
@keyframes fall{from{transform:translateY(-110px)}to{transform:translateY(0)}}
@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
/* items */
.items h2{margin:0 0 10px;font-weight:400;font-size:19px;display:flex;justify-content:space-between;align-items:center}
.add{display:flex;gap:8px}
.add input{flex:1;min-width:0;font:inherit;padding:9px 12px;border:3px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink)}
.add button{border:3px solid var(--line);border-radius:12px;background:var(--yel);color:#1c1650;padding:0 16px;box-shadow:0 3px 0 var(--line)}
.hint{margin:8px 0 10px;color:var(--mute);font-size:14px;min-height:1.3em}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 6px 4px 12px;border:2px solid var(--line);border-radius:999px;background:var(--bg);font-size:15px}
.chip button{width:22px;height:22px;border:0;border-radius:50%;background:var(--pink);color:#fff;line-height:1;padding:0}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
/* result */
.ov{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;background:rgba(10,8,40,.72);padding:20px}
.ov.on{display:flex}
.rc{position:relative;z-index:2;background:var(--yel);color:#1c1650;border:4px solid #14123a;border-radius:26px;box-shadow:0 8px 0 #14123a;text-align:center;padding:22px 30px 26px;width:min(92vw,380px);animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.3) rotate(-8deg);opacity:0}}
.rc .em{font-size:52px}.rc p{margin:0;font-size:18px}
.rc h2{margin:6px 0 16px;font-family:'Black Han Sans','Jua',sans-serif;font-weight:400;font-size:clamp(34px,10vw,52px);line-height:1.15;word-break:keep-all;overflow-wrap:anywhere}
.rc button{border:3px solid #14123a;border-radius:999px;background:var(--pink);color:#fff;padding:8px 30px;font-size:19px;box-shadow:0 4px 0 #14123a}
.cf{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:1}
.cf span{position:absolute;top:-8vh;font-size:26px;animation:fall2 linear forwards}
@keyframes fall2{to{transform:translateY(112vh) rotate(540deg)}}
@media (prefers-reduced-motion:reduce){h1,.tw,.cap.ready,.dome.shake .ball,.rc{animation:none}.cf{display:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <span class="tw" aria-hidden="true">✦</span><span class="tw" aria-hidden="true">✦</span><span class="tw" aria-hidden="true">✦</span>
    <h1>나다의<br>랜덤뽑기</h1>
    <p class="sub">오늘은 뭘 고를까? 운에 맡겨봐요</p>
  </header>

  <div class="tabs" role="tablist">
    <button class="tab" role="tab" data-t="wheel" aria-selected="true"><span>🎡</span>돌림판</button>
    <button class="tab" role="tab" data-t="stick" aria-selected="false"><span>🍀</span>제비뽑기</button>
    <button class="tab" role="tab" data-t="gacha" aria-selected="false"><span>🎁</span>추억의 뽑기</button>
  </div>

  <section class="card stage panel" id="p-wheel">
    <div class="wheelbox"><div class="ptr"></div><canvas id="wheel" width="800" height="800" aria-label="돌림판"></canvas></div>
    <button class="big" id="spinBtn">돌려돌려 돌림판!</button>
  </section>

  <section class="card stage panel" id="p-stick" hidden>
    <p class="tip" id="stickTip">마음에 드는 제비를 쏙 뽑아보세요</p>
    <div class="cup" id="cup"></div>
    <button class="big" id="shuffleBtn">다시 섞기</button>
  </section>

  <section class="card stage panel" id="p-gacha" hidden>
    <div class="machine">
      <div class="dome" id="dome"></div>
      <div class="mbody">
        <div class="knobrow"><div class="knob" id="knob"></div><span>100원</span></div>
        <div class="outlet" id="outlet"></div>
      </div>
    </div>
    <p class="tip" id="gHint">손잡이를 돌려서 캡슐을 뽑아봐요</p>
    <button class="big" id="gBtn">돌리기</button>
  </section>

  <section class="card items" style="margin-top:18px">
    <h2><span>뽑기 항목 <small id="cnt"></small></span><button class="sm" id="clearBtn">비우기</button></h2>
    <div class="add"><input id="inp" type="text" placeholder="항목 입력 후 추가" aria-label="항목 입력" maxlength="60"><button id="addBtn">추가</button></div>
    <p class="hint" id="msg">쉼표로 여러 개를 한 번에 넣을 수 있어요</p>
    <div class="chips" id="chips"></div>
  </section>
</div>

<div class="ov" id="ov" role="dialog" aria-live="polite" aria-label="결과">
  <div class="cf" id="cf"></div>
  <div class="rc"><div class="em" id="rem">🎉</div><p>당첨!</p><h2 id="rt"></h2><button id="ok">확인</button></div>
</div>

<script>
(function(){
var $=function(s){return document.querySelector(s)};
var items=['치킨','피자','떡볶이','햄버거','초밥','라면'];
var COL=['#ff3d81','#ffd23f','#2ee6a6','#4d7cff','#ff8a3d','#a66bff'];
var DARKTXT={'#ffd23f':1,'#2ee6a6':1,'#ff8a3d':1};
var busy=false, tab='wheel';
var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;

function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function msg(t){$('#msg').textContent=t}
function ok(){if(items.length<2){msg('항목을 2개 이상 넣어주세요');return false}return true}

/* result */
function show(text,emoji){
  $('#rt').textContent=text;$('#rem').textContent=emoji;
  var cf=$('#cf');cf.innerHTML='';
  var E=['🎉','✨','⭐','🎊','💖','🍀'];
  for(var i=0;i<30;i++){var s=document.createElement('span');s.textContent=E[i%E.length];s.style.left=Math.random()*100+'%';s.style.animationDuration=(1.8+Math.random()*1.6)+'s';s.style.animationDelay=(Math.random()*.8)+'s';cf.appendChild(s)}
  $('#ov').classList.add('on');$('#ok').focus();
}
$('#ok').onclick=function(){$('#ov').classList.remove('on');busy=false;if(afterClose){var f=afterClose;afterClose=null;f()}};
var afterClose=null;

/* items UI */
function renderChips(){
  var c=$('#chips');c.innerHTML='';
  items.forEach(function(t,i){
    var d=document.createElement('span');d.className='chip';d.textContent=t;
    var b=document.createElement('button');b.textContent='×';b.setAttribute('aria-label',t+' 삭제');
    b.onclick=function(){if(busy)return;items.splice(i,1);refresh()};
    d.appendChild(b);c.appendChild(d);
  });
  $('#cnt').textContent='('+items.length+'개)';
}
function refresh(){renderChips();drawWheel();buildSticks();msg('쉼표로 여러 개를 한 번에 넣을 수 있어요')}
function addItems(){
  if(busy)return;
  var v=$('#inp').value.split(/[,\n]/).map(function(s){return s.trim()}).filter(Boolean);
  if(!v.length)return;
  if(items.length+v.length>40){msg('항목은 최대 40개까지 넣을 수 있어요');return}
  items=items.concat(v);$('#inp').value='';refresh();
}
$('#addBtn').onclick=addItems;
$('#inp').addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();addItems()}});
$('#clearBtn').onclick=function(){if(busy)return;items=[];refresh();$('#inp').focus()};

/* tabs */
document.querySelectorAll('.tab').forEach(function(b){
  b.onclick=function(){
    if(busy)return;tab=b.dataset.t;
    document.querySelectorAll('.tab').forEach(function(x){x.setAttribute('aria-selected',x===b)});
    ['wheel','stick','gacha'].forEach(function(n){$('#p-'+n).hidden=(n!==tab)});
    if(tab==='wheel')drawWheel();
  };
});

/* wheel */
var cv=$('#wheel'),cx=cv.getContext('2d'),rot=0;
function drawWheel(){
  var S=cv.width,C=S/2,R=C-34,n=items.length;
  cx.clearRect(0,0,S,S);
  cx.save();cx.translate(C,C);
  cx.beginPath();cx.arc(0,0,C-4,0,7);cx.fillStyle='#14123a';cx.fill();
  if(!n){cx.fillStyle='#fff';cx.font='bold 40px Jua, sans-serif';cx.textAlign='center';cx.fillText('항목을 추가해주세요',0,12);cx.restore();return}
  var a=Math.PI*2/n;
  for(var i=0;i<n;i++){
    var col=COL[i%6];if(n>1&&i===n-1&&i%6===0)col=COL[3];
    cx.beginPath();cx.moveTo(0,0);cx.arc(0,0,R,rot+i*a,rot+(i+1)*a);cx.closePath();
    cx.fillStyle=col;cx.fill();cx.lineWidth=4;cx.strokeStyle='#14123a';cx.stroke();
    cx.save();cx.rotate(rot+(i+.5)*a);cx.textAlign='right';cx.textBaseline='middle';
    cx.fillStyle=DARKTXT[col]?'#14123a':'#fff';
    var fs=Math.max(20,Math.min(50,60-n*2.2));cx.font=fs+'px Jua, "Malgun Gothic", sans-serif';
    var t=items[i];if(t.length>9)t=t.slice(0,8)+'…';
    cx.fillText(t,R-26,0);cx.restore();
  }
  for(var k=0;k<24;k++){var ang=k*Math.PI/12;cx.beginPath();cx.arc(Math.cos(ang)*(C-19),Math.sin(ang)*(C-19),6,0,7);cx.fillStyle=k%2?'#ffd23f':'#fff';cx.fill()}
  cx.beginPath();cx.arc(0,0,R*.14,0,7);cx.fillStyle='#fff';cx.fill();cx.lineWidth=6;cx.strokeStyle='#14123a';cx.stroke();
  cx.fillStyle='#ff3d81';cx.font='bold 30px "Black Han Sans", Jua, sans-serif';cx.textAlign='center';cx.textBaseline='middle';cx.fillText('GO',0,2);
  cx.restore();
}
function spin(){
  if(busy||!ok())return;busy=true;
  var n=items.length,a=Math.PI*2/n,w=Math.floor(Math.random()*n),TAU=Math.PI*2;
  var want=-Math.PI/2-(w+.5)*a+(Math.random()-.5)*a*.7;
  var cur=rot,d=((want-cur)%TAU+TAU)%TAU;
  var target=cur+d+TAU*(5+Math.floor(Math.random()*3));
  var t0=performance.now(),dur=reduce?1200:5200;
  function f(t){
    var p=Math.min(1,(t-t0)/dur),e=1-Math.pow(1-p,4);
    rot=cur+(target-cur)*e;drawWheel();
    if(p<1)requestAnimationFrame(f);
    else{rot=target;show(items[w],'🎡')}
  }
  requestAnimationFrame(f);
}
$('#spinBtn').onclick=spin;cv.onclick=spin;

/* sticks */
function buildSticks(){
  var cup=$('#cup');cup.innerHTML='';
  var ord=shuffle(items);
  ord.forEach(function(t){
    var b=document.createElement('button');b.className='stick';b.setAttribute('aria-label','제비 뽑기');
    b.style.setProperty('--r',(Math.random()*8-4).toFixed(1)+'deg');
    b.innerHTML='<i></i><b></b>';b.lastChild.textContent=t;
    b.onclick=function(){
      if(busy||b.classList.contains('out'))return;busy=true;b.classList.add('out');
      setTimeout(function(){show(t,'🍀')},650);
    };
    cup.appendChild(b);
  });
  $('#stickTip').textContent=items.length?'마음에 드는 제비를 쏙 뽑아보세요':'항목을 추가해주세요';
}
$('#shuffleBtn').onclick=function(){if(!busy)buildSticks()};

/* gacha */
var dome=$('#dome');
(function(){
  for(var i=0;i<13;i++){
    var b=document.createElement('div');b.className='ball';
    b.style.setProperty('--c',COL[i%6]);
    b.style.left=(Math.random()*160+2)+'px';b.style.top=(60+Math.random()*112)+'px';
    dome.appendChild(b);
  }
})();
var knobDeg=0;
$('#gBtn').onclick=function(){
  if(busy)return;
  if($('#outlet').firstChild){$('#gHint').textContent='먼저 나온 캡슐을 눌러서 열어보세요!';return}
  if(!ok())return;busy=true;
  knobDeg+=360;$('#knob').style.transform='rotate('+knobDeg+'deg)';
  dome.classList.add('shake');$('#gHint').textContent='드르륵 드르륵…';
  setTimeout(function(){
    dome.classList.remove('shake');
    var pick=items[Math.floor(Math.random()*items.length)];
    var cap=document.createElement('button');cap.className='cap';cap.setAttribute('aria-label','캡슐 열기');
    cap.style.setProperty('--c',COL[Math.floor(Math.random()*6)]);
    cap.innerHTML='<div class="t"></div><div class="b"></div>';
    $('#outlet').appendChild(cap);
    setTimeout(function(){cap.classList.add('ready');busy=false;$('#gHint').textContent='캡슐이 나왔어요! 눌러서 열어보세요'},800);
    cap.onclick=function(){
      if(busy||cap.classList.contains('open'))return;busy=true;
      cap.classList.remove('ready');cap.style.animation='none';cap.classList.add('open');
      setTimeout(function(){afterClose=function(){cap.remove();$('#gHint').textContent='한 번 더 뽑아볼까요?'};show(pick,'🎁')},650);
    };
  },1100);
};

refresh();
})();
</script>
</body>
</html>
